name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-v2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-v2/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - name: Migrations apply cleanly
        env:
          DATABASE_URL: sqlite:///./ci_migrate.db
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://api.example.org
