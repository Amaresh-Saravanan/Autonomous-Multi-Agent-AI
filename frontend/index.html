<!doctype html>
<!--
  Phase 0 frontend shell (tracker 0.8/0.9). Plain HTML+JS+MapLibre via CDN —
  no npm/Next.js build step required to see the loop work. The full
  Next.js + Tailwind + framer-motion + react-grid-layout stack from
  UX_DESIGN.md is Phase 1+; this proves ingest -> agent -> map, nothing more.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>EOC Dashboard — Phase 0 slice</title>
<link href="https://unpkg.com/maplibre-gl@3/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3/dist/maplibre-gl.js"></script>
<style>
  :root[data-theme="dark"] {
    --bg-base: #0B0E14; --bg-surface: rgba(20,25,48,0.85);
    --border: #2A3142; --text-primary: #E6EAF2; --text-muted: #8A93A6;
    --sev-low: #22C55E; --sev-moderate: #EAB308; --sev-high: #F97316; --sev-critical: #EF4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-base); color: var(--text-primary);
         font-family: system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; }
  /* Subtle top vignette so panels/brand bar sit on a bit of depth instead of
     bare map — cheap, no extra layer or asset. */
  #map::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(11,14,20,.55) 0%, rgba(11,14,20,0) 12%);
  }
  #brand {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; padding: 6px 14px;
    background: var(--bg-surface); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 999px; font-size: 12px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted);
    box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 4;
  }
  #brand strong { color: var(--text-primary); font-weight: 700; }
  #brand .pulse-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--sev-low);
    box-shadow: 0 0 0 rgba(34,197,94,.6); animation: livePulse 2.4s ease-out infinite;
  }
  @keyframes livePulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
    70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }
  #panel {
    position: absolute; top: 16px; right: 16px; width: 340px; max-height: 80vh;
    overflow-y: auto; background: var(--bg-surface); backdrop-filter: blur(6px);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  #panel h2 {
    margin: 0 0 10px; font-size: 12px; font-weight: 700; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-muted);
  }
  #status { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  .card {
    border-left: 4px solid var(--sev-low); background: rgba(28,34,48,0.6);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    animation: slideIn 200ms ease-out;
    transition: transform 150ms ease, box-shadow 150ms ease;
  }
  .card:hover { transform: translateX(-2px); }
  .card.sev-high { border-left-color: var(--sev-high); }
  .card.sev-critical {
    border-left-color: var(--sev-critical); box-shadow: 0 0 12px rgba(239,68,68,.35);
    animation: slideIn 200ms ease-out, criticalBreathe 2.6s ease-in-out infinite;
  }
  @keyframes criticalBreathe {
    0%, 100% { box-shadow: 0 0 12px rgba(239,68,68,.35); }
    50% { box-shadow: 0 0 20px rgba(239,68,68,.6); }
  }
  .card .action { font-weight: 600; font-size: 14px; }
  .card .why { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .card .actions { margin-top: 8px; display: flex; gap: 8px; }
  .card .actions button {
    cursor: pointer; font-size: 11px; padding: 4px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: var(--text-primary);
    transition: background 120ms ease, border-color 120ms ease;
  }
  .card .actions button:hover { background: rgba(255,255,255,0.12); border-color: var(--text-muted); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  #send-form { position: absolute; bottom: 16px; left: 16px; background: var(--bg-surface);
    backdrop-filter: blur(6px); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; font-size: 12px; }
  #send-form input { width: 80px; margin-right: 8px; }
  #send-form button { cursor: pointer; }
  #layers { position: absolute; top: 16px; left: 16px; background: var(--bg-surface);
    backdrop-filter: blur(6px); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; font-size: 12px; }
  #layers label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #login-overlay { position: fixed; inset: 0; background: var(--bg-base); display: flex;
    align-items: center; justify-content: center; z-index: 10; }
  #login-box { background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; width: 280px; }
  #login-box h2 { margin: 0 0 16px; font-size: 16px; }
  #login-box input { width: 100%; margin-bottom: 10px; padding: 6px 8px; box-sizing: border-box;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-primary); }
  #login-box button { width: 100%; padding: 8px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: rgba(255,255,255,0.08); color: var(--text-primary); }
  #login-error { color: var(--sev-critical); font-size: 12px; margin-bottom: 8px; min-height: 14px; }
  #whoami { position: absolute; top: 16px; right: 372px; z-index: 5; font-size: 12px;
    color: var(--text-muted); background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; }
  #whoami button { cursor: pointer; font-size: 11px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.05); color: var(--text-primary); border-radius: 4px; padding: 2px 6px; }
</style>
</head>
<body>
  <div id="login-overlay">
    <div id="login-box">
      <h2>EOC Dashboard login</h2>
      <div id="login-error"></div>
      <form id="login-form">
        <input id="login-username" placeholder="username" autocomplete="username" />
        <input id="login-password" type="password" placeholder="password" autocomplete="current-password" />
        <button type="submit">Log in</button>
      </form>
    </div>
  </div>

  <div id="whoami" style="display:none;">
    <span id="whoami-label"></span>
    <button id="logout-btn">Log out</button>
  </div>

  <div id="brand"><span class="pulse-dot"></span><strong>EOC</strong> Command Dashboard</div>

  <div id="map"></div>

  <div id="layers">
    <label><input type="checkbox" id="toggle-severity" checked /> Severity heat layer</label>
    <label><input type="checkbox" id="toggle-routes" checked /> Routes</label>
    <label><input type="checkbox" id="toggle-resources" checked /> Resources</label>
  </div>

  <div id="panel">
    <h2>Alerts</h2>
    <div id="alerts-feed"></div>
    <hr style="border-color: var(--border); margin: 12px 0;" />
    <h2>Recommendations</h2>
    <div id="status">connecting…</div>
    <div id="feed"></div>
  </div>

  <form id="send-form">
    Simulate water-level reading:
    <input id="reading" type="number" step="0.1" value="5.5" />
    <button type="submit">Send critical spike</button>
  </form>

  <script>
    const API = "http://localhost:8000";

    // Auth (tracker 3.4 gated most GETs + approve/reject). /ingest and /ws/alerts
    // stay open on the backend, so they need no token here.
    let authToken = localStorage.getItem("authToken");
    let currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");

    function authHeaders() {
      return authToken ? { Authorization: "Bearer " + authToken } : {};
    }

    // Wraps fetch with the bearer token; on 401 (expired/invalid) drops back to login.
    async function authFetch(url, opts = {}) {
      const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), ...authHeaders() } });
      if (res.status === 401) {
        logout();
        throw new Error("session expired");
      }
      return res;
    }

    function showLogin(message) {
      document.getElementById("login-error").textContent = message || "";
      document.getElementById("login-overlay").style.display = "flex";
      document.getElementById("whoami").style.display = "none";
    }

    function logout() {
      authToken = null;
      currentUser = null;
      localStorage.removeItem("authToken");
      localStorage.removeItem("currentUser");
      showLogin();
    }

    document.getElementById("logout-btn").addEventListener("click", logout);

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) throw new Error("invalid credentials");
        const body = await res.json();
        authToken = body.access_token;
        // JWT payload (role/agency) is base64 in the token's middle segment — decode
        // for a "logged in as" label without a round trip to a /me endpoint.
        currentUser = JSON.parse(atob(authToken.split(".")[1]));
        localStorage.setItem("authToken", authToken);
        localStorage.setItem("currentUser", JSON.stringify(currentUser));
        onAuthenticated();
      } catch (err) {
        document.getElementById("login-error").textContent = "Login failed — check username/password.";
      }
    });

    function onAuthenticated() {
      document.getElementById("login-overlay").style.display = "none";
      document.getElementById("whoami").style.display = "flex";
      document.getElementById("whoami-label").textContent =
        `${currentUser.username} (${currentUser.role})`;
      loadResources();
      connectWS();
    }

    // Dark command-center basemap (CARTO Dark Matter — free vector style, no
    // API key/billing needed, unlike Google Maps). Tuned further on "load"
    // below so it reads as part of this dashboard's own visual language
    // (severity color ramp, glass panels) rather than a bolted-on widget.
    const map = new maplibregl.Map({
      container: "map",
      style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
      center: [80.2707, 13.0827],
      zoom: 10,
      pitch: 0,
    });

    const statusEl = document.getElementById("status");
    const feedEl = document.getElementById("feed");
    const alertsFeedEl = document.getElementById("alerts-feed");
    let currentIncidentId = null;
    let severityLayerReady = false;

    const recsById = new Map();

    // DS-1 severity heat layer (tracker 1.10): color ramp matches the .card
    // severity classes above — one severity language across map + feed.
    // Deepen CARTO Dark Matter's default blacks/grays to match this
    // dashboard's own token palette (--bg-base #0B0E14) instead of leaving
    // the stock basemap colors — the small touch that makes the map read as
    // purpose-built rather than a generic tile swap.
    function tuneBasemapPalette() {
      const style = map.getStyle();
      style.layers.forEach((layer) => {
        // Guard every recolor by the layer's actual paint-property type first —
        // e.g. "waterway" is a line layer, not a fill, so setting fill-color on
        // it throws and (since forEach doesn't catch per-iteration) silently
        // aborts every layer after it in style order.
        try {
          if (layer.type === "background") {
            map.setPaintProperty(layer.id, "background-color", "#0B0E14");
          } else if (layer.type === "fill" && layer.id === "water") {
            map.setPaintProperty(layer.id, "fill-color", "#0F1626");
          } else if (layer.type === "fill" && (layer.id.includes("landuse") || layer.id.includes("landcover") || layer.id.includes("park"))) {
            map.setPaintProperty(layer.id, "fill-color", "#101521");
          } else if (layer.type === "line" && layer.id.includes("road")) {
            map.setPaintProperty(layer.id, "line-color", "#232A3D");
          }
        } catch (e) { /* not every layer accepts the paint prop we tried */ }
      });
    }

    map.on("load", () => {
      tuneBasemapPalette();

      map.addSource("severity", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "severity-fill", type: "fill", source: "severity",
        paint: {
          "fill-color": [
            "interpolate", ["linear"], ["get", "severity"],
            0, "#22C55E", 0.5, "#EAB308", 0.85, "#F97316", 1, "#EF4444",
          ],
          "fill-opacity": 0.35,
        },
      });
      severityLayerReady = true;

      map.addSource("routes", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      map.addLayer({
        id: "routes-line", type: "line", source: "routes",
        paint: {
          "line-color": ["case", ["get", "blocked"], "#EF4444", "#22C55E"],
          "line-width": 3,
        },
      });
    });

    document.getElementById("toggle-severity").addEventListener("change", (e) => {
      if (severityLayerReady) {
        map.setLayoutProperty("severity-fill", "visibility", e.target.checked ? "visible" : "none");
      }
    });

    document.getElementById("toggle-routes").addEventListener("change", (e) => {
      map.setLayoutProperty("routes-line", "visibility", e.target.checked ? "visible" : "none");
    });

    document.getElementById("toggle-resources").addEventListener("change", (e) => {
      resourceMarkers.forEach((m) => {
        m.getElement().style.display = e.target.checked ? "" : "none";
      });
    });

    const RESOURCE_COLORS = { hospitals: "#EF4444", shelters: "#3B82F6", teams: "#A855F7", ambulances: "#F97316" };
    const resourceMarkers = [];

    async function loadResources() {
      try {
        const res = await authFetch(`${API}/resources`);
        const data = await res.json();
        Object.entries(RESOURCE_COLORS).forEach(([category, color]) => {
          (data[category] || []).forEach((item) => {
            const marker = new maplibregl.Marker({ color })
              .setLngLat([item.lon, item.lat])
              .setPopup(new maplibregl.Popup().setText(`${category.slice(0, -1)}: ${item.name || item.id}`))
              .addTo(map);
            resourceMarkers.push(marker);
          });
        });
      } catch (err) {
        console.error("Failed to load resources", err);
      }
    }

    const routesByIncident = {};

    function refreshRoutes() {
      const features = Object.entries(routesByIncident).map(([incidentId, r]) => ({
        type: "Feature",
        geometry: { type: "LineString", coordinates: r.route_line },
        properties: { incident_id: incidentId, blocked: r.blocked },
      }));
      map.getSource("routes").setData({ type: "FeatureCollection", features });
    }

    async function refreshSeverity(incidentId) {
      if (!severityLayerReady || !incidentId) return;
      const res = await authFetch(`${API}/incidents/${incidentId}/severity`);
      const geojson = await res.json();
      map.getSource("severity").setData(geojson);
    }

    function sevClass(sev) {
      if (sev >= 0.85) return "sev-critical";
      if (sev >= 0.5) return "sev-high";
      return "";
    }

    async function decide(recId, action) {
      try {
        const res = await authFetch(`${API}/recommendations/${recId}/${action}`, { method: "POST" });
        if (!res.ok) throw new Error(`status ${res.status}`);
        const updated = await res.json();
        recsById.set(updated.rec_id, updated);
        renderFeed();
        renderAlerts();
      } catch (err) {
        alert("Failed to update recommendation");
      }
    }

    function renderCard(rec) {
      const div = document.createElement("div");
      div.className = "card " + sevClass(rec.severity);
      div.innerHTML = `
        <div class="action">${rec.agent_id} · ${rec.action}</div>
        <div class="why">${rec.rationale}</div>
        <div class="why">confidence ${rec.confidence.toFixed(2)} · ${rec.status}</div>
      `;
      if (rec.status === "pending") {
        const actions = document.createElement("div");
        actions.className = "actions";
        const approveBtn = document.createElement("button");
        approveBtn.textContent = "Approve";
        approveBtn.addEventListener("click", () => decide(rec.rec_id, "approve"));
        const rejectBtn = document.createElement("button");
        rejectBtn.textContent = "Reject";
        rejectBtn.addEventListener("click", () => decide(rec.rec_id, "reject"));
        actions.appendChild(approveBtn);
        actions.appendChild(rejectBtn);
        div.appendChild(actions);
      }
      return div;
    }

    function sortedRecs() {
      return [...recsById.values()].sort((a, b) => b.created_at.localeCompare(a.created_at));
    }

    function renderFeed() {
      feedEl.innerHTML = "";
      sortedRecs().forEach((rec) => feedEl.appendChild(renderCard(rec)));
    }

    function renderAlerts() {
      alertsFeedEl.innerHTML = "";
      sortedRecs()
        .filter((rec) => rec.severity >= 0.5 && rec.status === "pending")
        .forEach((rec) => alertsFeedEl.appendChild(renderCard(rec)));
    }

    function addMarker(rec) {
      if (rec.geo && rec.geo.coordinates && rec.geo.coordinates.length === 2) {
        new maplibregl.Marker({ color: rec.severity >= 0.85 ? "#EF4444" : "#F97316" })
          .setLngLat(rec.geo.coordinates)
          .setPopup(new maplibregl.Popup().setText(rec.rationale))
          .addTo(map);
      }
    }

    function ingestRecommendations(recs) {
      let routesChanged = false;
      recs.forEach((rec) => {
        recsById.set(rec.rec_id, rec);
        addMarker(rec);
        if (rec.agent_id === "AG-6" && rec.details && rec.details.route_line) {
          routesByIncident[rec.incident_id] = {
            route_line: rec.details.route_line,
            blocked: !!rec.details.blocked,
          };
          routesChanged = true;
        }
      });
      renderFeed();
      renderAlerts();
      if (routesChanged) refreshRoutes();
    }

    function connectWS() {
      const ws = new WebSocket(API.replace("http", "ws") + "/ws/alerts");
      ws.onopen = () => (statusEl.textContent = "live");
      ws.onclose = () => { statusEl.textContent = "reconnecting…"; setTimeout(connectWS, 2000); };
      ws.onmessage = (evt) => {
        const msg = JSON.parse(evt.data);
        ingestRecommendations(msg.recommendations);
        currentIncidentId = msg.incident_id;
        refreshSeverity(currentIncidentId);
      };
    }
    if (authToken && currentUser) {
      onAuthenticated();
    } else {
      showLogin();
    }

    document.getElementById("send-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const reading = parseFloat(document.getElementById("reading").value);
      const res = await fetch(API + "/ingest/iot", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sensor_id: "wl-042", metric: "water_level", reading,
          unit: "m", lat: 13.0827, lon: 80.2707, incident_id: "demo-1",
        }),
      });
      const body = await res.json();
      ingestRecommendations(body.recommendations); // also render via HTTP response, not just WS
      currentIncidentId = body.incident_id;
      refreshSeverity(currentIncidentId);
    });
  </script>
</body>
</html>
